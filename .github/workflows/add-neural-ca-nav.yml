name: Add Neural CA navigation

on:
  push:
    paths:
      - '.github/workflows/add-neural-ca-nav.yml'

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Neural CA links to 2D and 3D pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('life.html')
          s = p.read_text(encoding='utf-8')
          old = '''      <div class="life-dimension-switch" aria-label="dimension switch">
                <span class="active">2D</span>
                <span class="future"><a href="life3d.html" style="color:inherit;text-decoration:none;">3D</a></span>
      </div>'''
          new = '''      <div class="life-dimension-switch" aria-label="life mode switch">
                <span class="active">2D</span>
                <span class="future"><a href="life3d.html" style="color:inherit;text-decoration:none;">3D</a></span>
                <span class="future"><a href="neural-life.html" style="color:inherit;text-decoration:none;">Neural CA</a></span>
      </div>'''
          if old not in s:
              raise SystemExit('2D switch block not found')
          s = s.replace(old, new, 1)
          s = s.replace('右上角可直接切换到 3D 生命游戏。', '右上角可切换到 3D 生命游戏与 Neural CA。', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('life3d.html')
          s = p.read_text(encoding='utf-8')
          old = '''      <div class="life-dimension-switch" aria-label="dimension switch">
        <span class="future"><a href="life.html">2D</a></span>
        <span class="active">3D</span>
      </div>'''
          new = '''      <div class="life-dimension-switch" aria-label="life mode switch">
        <span class="future"><a href="life.html">2D</a></span>
        <span class="active">3D</span>
        <span class="future"><a href="neural-life.html">Neural CA</a></span>
      </div>'''
          if old not in s:
              raise SystemExit('3D switch block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit navigation update
        shell: bash
        run: |
          if git diff --quiet -- life.html life3d.html; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add life.html life3d.html
          git commit -m "feat(life): link Neural CA from 2D and 3D pages"
          git push
