name: Add Neural CA navigation

on:
  push:
    paths:
      - .github/workflows/add-neural-ca-nav.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch life navigation
        run: |
          if ! grep -q 'href="neural-life.html"' life.html; then
            sed -i '/href="life3d.html"/a\                <span class="future"><a href="neural-life.html" style="color:inherit;text-decoration:none;">Neural CA</a></span>' life.html
          fi
          if ! grep -q 'href="neural-life.html"' life3d.html; then
            sed -i '/<span class="active">3D<\/span>/a\        <span class="future"><a href="neural-life.html">Neural CA</a></span>' life3d.html
          fi
          sed -i 's/右上角可直接切换到 3D 生命游戏。/右上角可切换到 3D 生命游戏与 Neural CA。/' life.html
      - name: Commit navigation
        run: |
          if git diff --quiet -- life.html life3d.html; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add life.html life3d.html
          git commit -m 'feat(life): link Neural CA from life pages'
          git push
