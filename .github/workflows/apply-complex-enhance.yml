name: Apply Complex Lab UX enhancement
on:
  push:
    paths:
      - '.github/workflows/apply-complex-enhance.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply enhancer
        run: python .github/scripts/apply_complex_enhance.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/complex-enhance.js '*.html'
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'feat: add guides presets and unified keyboard controls to Complex Lab'
          git push
