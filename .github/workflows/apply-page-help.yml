name: Apply Complex Lab page help
on:
  push:
    paths:
      - '.github/workflows/apply-page-help.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject page help
        run: python .github/scripts/apply_page_help.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'feat: add first-look guides to all Complex Lab experiments'
          git push
