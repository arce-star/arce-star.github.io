name: Build real crypto training data
on:
  push:
    paths:
      - '.github/workflows/build-real-crypto-training.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/build_real_crypto_training.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/crypto-real-kline-training.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'data: add real Binance crypto kline exercises'
            git push
          fi
