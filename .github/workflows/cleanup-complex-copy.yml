name: Cleanup Complex Lab copy
on:
  push:
    paths:
      - '.github/workflows/cleanup-complex-copy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cleanup copy
        run: python .github/scripts/cleanup_complex_copy.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add complex-lab.html assets/js/complex-enhance.js
          git commit -m 'refactor: simplify Complex Lab copy and load bilingual glossary'
          git push
