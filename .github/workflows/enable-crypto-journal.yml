name: Enable crypto practice journal
on:
  push:
    branches: [main]
    paths:
      - 'assets/js/crypto-practice-journal.js'
      - '.github/scripts/enable_crypto_journal.py'
      - '.github/workflows/enable-crypto-journal.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/enable_crypto_journal.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes'
          else
            git add investment-study.html
            git commit -m 'feat: enable crypto practice journal'
            git push
          fi
