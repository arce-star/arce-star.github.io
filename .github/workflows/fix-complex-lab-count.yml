name: Fix Complex Lab count
on:
  push:
    paths:
      - '.github/workflows/fix-complex-lab-count.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/fix_complex_lab_count.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add complex-lab.html
          git commit -m 'fix: update Complex Lab footer count'
          git push
