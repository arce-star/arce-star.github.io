name: Final Complex Lab fixes
on:
  push:
    paths:
      - '.github/workflows/fix-complex-lab-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Sandpile and Mandelbrot
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('sandpile.html')
          s = p.read_text(encoding='utf-8')
          old = "function addAt(x,y,n=1){for(let g=0;g<n;g++){const i=idx(x,y);z[i]++;if(z[i]>=4){if(!avalanche)beginAvalanche();enqueue(i)}else if(!avalanche&&g===n-1){} if(avalanche&&g<n-1)pendingGrains++}}"
          new = "function addAt(x,y,n=1){const i=idx(x,y);z[i]+=n;if(z[i]>=4){if(!avalanche)beginAvalanche();enqueue(i)}}"
          if old not in s:
              raise SystemExit('sandpile addAt target not found')
          s = s.replace(old, new, 1)
          s = s.replace("z[i]=r<.12?0:r<.30?1:r<.63?2:3", "z[i]=r<.07?0:r<.24?1:r<.59?2:3", 1)
          p.write_text(s, encoding='utf-8')

          p = Path('mandelbrot.html')
          s = p.read_text(encoding='utf-8')
          old = "function size(){const r=cv.parentElement.getBoundingClientRect(),d=devicePixelRatio||1;W=Math.max(320,Math.floor(r.width));H=Math.max(240,Math.floor(r.height));cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);render()}"
          new = "function size(){const r=cv.parentElement.getBoundingClientRect();W=Math.max(320,Math.floor(r.width));H=Math.max(240,Math.floor(r.height));cv.width=W;cv.height=H;ctx.setTransform(1,0,0,1,0,0);render()}"
          if old not in s:
              raise SystemExit('mandelbrot size target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sandpile.html mandelbrot.html
          git commit -m 'fix: correct sandpile grain accounting and HiDPI fractal rendering'
          git push
