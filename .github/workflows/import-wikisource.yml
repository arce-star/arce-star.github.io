name: Import public-domain Wikisource texts

on:
  push:
    branches: [main]
    paths:
      - "scripts/import_wikisource.py"
      - ".github/workflows/import-wikisource.yml"
      - "assets/data/reading/catalog.json"
      - "assets/data/reading/fulltext.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wenjian-wikisource-import
  cancel-in-progress: true

jobs:
  import:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip wikisource import]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download public-domain full texts from Wikisource
        run: python scripts/import_wikisource.py

      - name: Commit imported full texts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/reading/catalog.json assets/data/reading/fulltext.json
          if git diff --cached --quiet; then
            echo "No new public-domain full texts were imported."
            exit 0
          fi
          git commit -m "Import Wikisource public-domain full texts [skip wikisource import]"
          git push
