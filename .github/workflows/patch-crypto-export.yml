name: Patch crypto export
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch_crypto_export.py'
      - '.github/workflows/patch-crypto-export.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/patch_crypto_export.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes'
          else
            git add assets/js/crypto-real-practice.js
            git commit -m 'feat: export crypto training for ChatGPT'
            git push
          fi
