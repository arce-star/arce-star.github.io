name: Prune Complex Lab
on:
  push:
    paths:
      - '.github/workflows/prune-complex-lab.yml'
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prune homepage
        run: python .github/scripts/prune_complex_lab.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add complex-lab.html
          git commit -m 'refactor: prune Complex Lab to 32 focused experiments'
          git push
